<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PayGeo · Send to a phone, collect as cash</title>
<style>
  /* ── Brand palette: the only four colors in this file ───────────────── */
  :root {
    --blackberry: #200934;
    --gold:       #EEBA2B;
    --cream:      #FFFDF5;
    --black:      #000000;

    /* Derived tints: brand colors at reduced opacity, never new hues. */
    --ink-70:     color-mix(in srgb, var(--black) 70%, transparent);
    --ink-55:     color-mix(in srgb, var(--black) 55%, transparent);
    --bb-06:      color-mix(in srgb, var(--blackberry) 6%, transparent);
    --bb-10:      color-mix(in srgb, var(--blackberry) 10%, transparent);
    --bb-16:      color-mix(in srgb, var(--blackberry) 16%, transparent);
    --bb-28:      color-mix(in srgb, var(--blackberry) 28%, transparent);
    --bb-60:      color-mix(in srgb, var(--blackberry) 60%, transparent);
    --cream-10:   color-mix(in srgb, var(--cream) 10%, transparent);
    --cream-16:   color-mix(in srgb, var(--cream) 16%, transparent);
    --cream-75:   color-mix(in srgb, var(--cream) 75%, transparent);
    --black-30:   color-mix(in srgb, var(--black) 30%, transparent);
    --black-50:   color-mix(in srgb, var(--black) 50%, transparent);

    /* Motion: critically damped, no overshoot. */
    --ease:       cubic-bezier(.2, .8, .2, 1);
    --t-fast:     140ms;
    --t-base:     380ms;
    --t-slow:     560ms;

    color-scheme: light;
    font: 100%/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--cream);
    color: var(--black);
    -webkit-font-smoothing: antialiased;
    min-width: 320px;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid var(--blackberry);
    outline-offset: 3px;
    border-radius: 999px;
  }

  /* ── Frame ───────────────────────────────────────────────────────────── */
  .pg {
    max-width: 880px;
    margin: 0 auto;
    padding: clamp(20px, 4vw, 48px) clamp(16px, 4vw, 40px) clamp(20px, 3vw, 36px);
  }
  .pg-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px 24px;
    flex-wrap: wrap;
  }
  .pg-copy { max-width: 58ch; min-width: 0; flex: 1 1 280px; }
  .pg-title {
    margin: 0;
    font-size: clamp(1.6rem, 1.05rem + 2.3vw, 2.5rem);
    line-height: 1.08;
    letter-spacing: -0.022em;
    font-weight: 650;
    color: var(--blackberry);
    text-wrap: balance;
  }
  .pg-sub {
    margin: 0.75em 0 0;
    font-size: clamp(0.98rem, 0.9rem + 0.35vw, 1.1rem);
    line-height: 1.5;
    color: var(--ink-70);
    text-wrap: pretty;
  }

  /* Language toggle */
  .lang {
    display: inline-flex;
    padding: 3px;
    border-radius: 999px;
    background: var(--bb-06);
    flex: 0 0 auto;
    position: relative;
  }
  .lang button {
    position: relative;
    z-index: 1;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--blackberry);
    transition: color var(--t-base) var(--ease);
  }
  .lang button[aria-pressed="true"] { color: var(--cream); }
  .lang-thumb {
    position: absolute;
    inset: 3px auto 3px 3px;
    width: calc(50% - 3px);
    border-radius: 999px;
    background: var(--blackberry);
    transition: transform var(--t-base) var(--ease);
  }
  .lang[data-lang="es"] .lang-thumb { transform: translateX(100%); }

  /* ── Stage: one device at a time, stacked in one grid cell ───────────── */
  .stage {
    position: relative;
    margin-top: clamp(28px, 4vw, 44px);
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
    transition: transform var(--t-base) var(--ease);
  }
  .stage.is-dragging { transition: none; }
  .stage { perspective: 1600px; }
  .device {
    container-type: inline-size;
    grid-area: 1 / 1;
    justify-self: center;
    align-self: center;
    min-width: 0;
    transform-origin: 50% 50%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    will-change: transform, opacity;
  }
  .phone { width: min(64%, 236px); }
  .atm   { width: min(100%, 300px); }
  .device:not(.is-active):not(.is-leaving) { opacity: 0; visibility: hidden; }
  .device.is-leaving { z-index: 1; pointer-events: none; }

  /* ── Phone ───────────────────────────────────────────────────────────── */
  .phone-body {
    aspect-ratio: 9 / 18.6;
    border-radius: 15cqw;
    background: var(--blackberry);
    padding: 4.2cqw;
    box-shadow: 0 1.2cqw 3cqw var(--bb-16), 0 10cqw 24cqw -8cqw var(--bb-28);
    position: relative;
  }
  .phone-body::after {               /* side button */
    content: "";
    position: absolute;
    right: -1.2cqw;
    top: 26%;
    width: 1.2cqw;
    height: 11%;
    border-radius: 0 1cqw 1cqw 0;
    background: var(--blackberry);
  }
  .screen {
    position: relative;
    height: 100%;
    border-radius: 11cqw;
    background: var(--cream);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    font-size: 5.6cqw;
    line-height: 1.3;
    color: var(--blackberry);
  }
  .notch {
    position: absolute;
    top: 3cqw;
    left: 50%;
    transform: translateX(-50%);
    width: 30cqw;
    height: 6cqw;
    border-radius: 999px;
    background: var(--blackberry);
  }
  .statusbar {
    display: flex;
    justify-content: space-between;
    padding: 4cqw 7cqw 0;
    font-size: 4.6cqw;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .sig { display: inline-flex; gap: 1cqw; align-items: flex-end; height: 4cqw; }
  .sig i { display: block; width: 1.4cqw; background: var(--blackberry); border-radius: 0.5cqw; }
  .sig i:nth-child(1) { height: 40%; }
  .sig i:nth-child(2) { height: 60%; }
  .sig i:nth-child(3) { height: 80%; }
  .sig i:nth-child(4) { height: 100%; }

  /* Sender app */
  .app {
    padding: 9cqw 7cqw 8cqw;
    display: flex;
    flex-direction: column;
    gap: 4cqw;
    flex: 1;
  }
  .app-brand {
    font-size: 4.2cqw;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-55);
  }
  .app-title {
    font-size: 8cqw;
    font-weight: 650;
    letter-spacing: -0.015em;
    line-height: 1.1;
    margin-bottom: 2cqw;
  }
  .field {
    background: var(--bb-06);
    border-radius: 4.5cqw;
    padding: 3.2cqw 4cqw;
    min-height: 15cqw;
    transition: box-shadow var(--t-fast) var(--ease);
  }
  .field.is-focus { box-shadow: inset 0 0 0 0.6cqw var(--bb-28); }
  .field-label {
    display: block;
    font-size: 3.9cqw;
    font-weight: 600;
    color: var(--ink-55);
    letter-spacing: 0.02em;
  }
  .field-value {
    display: block;
    font-size: 6cqw;
    font-weight: 600;
    min-height: 1.3em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .field-value.amount { font-size: 9cqw; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; }
  .caret {
    display: inline-block;
    width: 0.09em;
    height: 1em;
    vertical-align: -0.15em;
    margin-left: 0.04em;
    background: var(--blackberry);
    opacity: 0;
  }
  .field.is-focus .caret { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }

  .screen-btn {
    margin-top: auto;
    border-radius: 999px;
    background: var(--blackberry);
    color: var(--cream);
    font-weight: 650;
    font-size: 5.6cqw;
    padding: 4.2cqw 0;
    text-align: center;
    transform: scale(1);
    transition: transform var(--t-fast) var(--ease), opacity var(--t-fast) var(--ease), background var(--t-base) var(--ease), color var(--t-base) var(--ease);
  }
  .sender.is-pressed .screen-btn { transform: scale(0.95); opacity: 0.85; }
  .screen-btn .lbl-sent { display: none; }
  .sender.is-sent .screen-btn .lbl-send { display: none; }
  .sender.is-sent .screen-btn .lbl-sent { display: inline; }
  .sender.is-sent .screen-btn { background: var(--gold); color: var(--blackberry); }

  /* Recipient lock screen */
  .lock {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14cqw 6cqw 8cqw;
    position: relative;
  }
  .lock-date { font-size: 4.6cqw; font-weight: 600; color: var(--ink-55); }
  .lock-time {
    font-size: 20cqw;
    font-weight: 300;
    letter-spacing: -0.04em;
    line-height: 1;
    margin-top: 1cqw;
  }
  .notif {
    width: 100%;
    margin-top: 8cqw;
    border-radius: 6cqw;
    background: var(--blackberry);
    color: var(--cream);
    padding: 4.4cqw 5cqw 5cqw;
    transform-origin: 50% 0%;
    opacity: 0;
    transform: translateY(-6cqw) scale(0.94);
    transition: opacity var(--t-base) var(--ease), transform var(--t-slow) var(--ease);
    box-shadow: 0 6cqw 16cqw -6cqw var(--bb-60);
  }
  .recipient.is-notified .notif { opacity: 1; transform: none; }
  .notif-head {
    display: flex;
    justify-content: space-between;
    font-size: 3.9cqw;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--cream-75);
  }
  .notif-head .now { text-transform: none; letter-spacing: 0; font-weight: 500; }
  .notif-title { font-size: 4.8cqw; font-weight: 600; margin-top: 2cqw; }
  .notif-code {
    font-size: 11.5cqw;
    font-weight: 650;
    letter-spacing: 0.08em;
    line-height: 1.1;
    margin-top: 1.5cqw;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
  }
  .lock-dim {                                      /* screen asleep → lights up */
    position: absolute;
    inset: 0;
    background: var(--blackberry);
    opacity: 0.86;
    transition: opacity var(--t-slow) var(--ease);
    pointer-events: none;
  }
  .recipient.is-notified .lock-dim { opacity: 0; }

  /* ── ATM: a plain fascia — screen, keypad, cash slot ─────────────────── */
  .atm-body {
    position: relative;
    border-radius: 4cqw;
    background: var(--blackberry);
    padding: 7cqw 7cqw 51cqw;
    box-shadow: 0 1cqw 2.5cqw var(--bb-16), 0 10cqw 26cqw -10cqw var(--bb-28);
    color: var(--cream);
    display: flex;
    flex-direction: column;
    gap: 6.5cqw;
  }
  .atm-screen {
    background: var(--cream);
    color: var(--blackberry);
    border-radius: 2.4cqw;
    padding: 5.5cqw 5.5cqw 6cqw;
    aspect-ratio: 16 / 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    box-shadow: inset 0 0 0 0.5cqw var(--bb-16);
  }
  .atm-msg {
    font-size: 5.6cqw;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.25;
  }
  .atm-msg .m2 { display: none; }
  .atm.is-dispensing .atm-msg .m1 { display: none; }
  .atm.is-dispensing .atm-msg .m2 { display: inline; }
  .code-cells {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 2cqw;
  }
  .code-cells span {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 12cqw;
    border-radius: 1.8cqw;
    background: var(--bb-06);
    box-shadow: inset 0 -0.5cqw 0 var(--bb-16);
    font-size: 7.4cqw;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    transition: background var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease), opacity var(--t-base) var(--ease);
  }
  .code-cells span.is-filled { background: var(--bb-10); box-shadow: inset 0 0 0 0.5cqw var(--bb-28); }
  .atm.is-dispensing .code-cells span { opacity: 0.35; }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2.6cqw;
    width: 58%;
    margin: 0 auto;
  }
  .key {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1.7;
    border-radius: 1.6cqw;
    background: var(--cream-10);
    color: var(--cream);
    font-size: 4.6cqw;
    font-weight: 600;
    box-shadow: inset 0 -0.6cqw 0 var(--black-30);
    transition: background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
  }
  .key.is-pressed {
    background: var(--gold);
    color: var(--blackberry);
    transform: translateY(0.4cqw);
    box-shadow: inset 0 -0.2cqw 0 var(--black-30);
  }

  .cash-unit { position: relative; margin-top: 1cqw; }
  .cash-slot {
    position: relative;
    height: 5cqw;
    border-radius: 1.4cqw;
    background: var(--black-50);
    box-shadow: inset 0 0.7cqw 1.2cqw var(--black-30);
    z-index: 2;
  }
  .cash-slot::before {
    content: "";
    position: absolute;
    inset: 1.6cqw 2cqw;
    border-radius: 999px;
    background: var(--cream-16);
  }
  .bills {
    position: absolute;
    left: 6%;
    right: 6%;
    top: 2.4cqw;
    height: 56cqw;
    overflow: hidden;
    clip-path: inset(0 -40% -40% -40%);
    pointer-events: none;
  }
  .bill {
    position: absolute;
    left: 50%;
    top: 0;
    width: 84%;
    height: auto;
    display: block;
    border-radius: 0.6cqw;
    box-shadow: 0 0.6cqw 1.8cqw var(--black-30);
    transform: translate(-50%, -110%) rotate(0deg);
    transition: transform var(--t-slow) var(--ease), opacity var(--t-base) var(--ease);
    opacity: 0;
    overflow: hidden;
  }
  .atm.is-dispensing .bill { opacity: 1; }
  .atm.is-dispensing .bill:nth-child(1) { transform: translate(-50%, 12%)   rotate(-1.5deg); transition-delay: 0ms; }
  .atm.is-dispensing .bill:nth-child(2) { transform: translate(-49.4%, 42%) rotate(1deg);    transition-delay: 120ms; }
  .atm.is-dispensing .bill:nth-child(3) { transform: translate(-50.6%, 72%) rotate(-0.6deg); transition-delay: 240ms; }
  .usd-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* ── Progress dots ──────────────────────────────────────────────────── */
  .dots {
    margin-top: clamp(22px, 3vw, 32px);
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 6px;
  }
  .dot {
    position: relative;
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--bb-28);
    overflow: hidden;
    transition: width var(--t-base) var(--ease), background var(--t-base) var(--ease);
  }
  .dot::before { content: ""; position: absolute; inset: -10px; }   /* larger hit target */
  .dot:hover { background: var(--bb-60); }
  .dot[aria-current="step"] { width: 28px; background: var(--bb-16); }
  .dot .fill {
    position: absolute;
    inset: 0;
    background: var(--blackberry);
    transform-origin: 0 50%;
    transform: scaleX(0);
  }
  .dot[aria-current="step"] .fill { transform: scaleX(var(--p, 0)); }
  .dot[aria-current="step"].no-progress .fill { transform: scaleX(1); }
  .dot:focus-visible { outline-offset: 5px; }

  /* ── Footnotes ──────────────────────────────────────────────────────── */
  .notes {
    margin-top: clamp(24px, 3.5vw, 36px);
    padding-top: 16px;
    border-top: 1px solid var(--bb-10);
    text-align: center;
  }
  .notes p { margin: 0; }
  .patents {
    font-size: 0.8rem;
    line-height: 1.5;
    color: var(--ink-55);
    letter-spacing: 0.005em;
    text-wrap: balance;
    max-width: 72ch;
    margin-inline: auto;
  }
  .footer {
    margin-top: 6px !important;
    font-size: 0.72rem;
    color: var(--ink-55);
    letter-spacing: 0.02em;
  }

  /* ── Reduced motion: cross-fades only, no autoplay ─────────────────── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 180ms !important;
      transition-delay: 0ms !important;
      animation: none !important;
    }
    .stage { transition: none; }
    .notif, .recipient.is-notified .notif,
    .bill, .atm.is-dispensing .bill,
    .screen-btn, .key, .dot, .lang-thumb { transition-property: opacity, background, color; }
    .notif { transform: none; }
    .atm.is-dispensing .bill:nth-child(1) { transform: translate(-50%, 12%)   rotate(-1.5deg); }
    .atm.is-dispensing .bill:nth-child(2) { transform: translate(-49.4%, 42%) rotate(1deg); }
    .atm.is-dispensing .bill:nth-child(3) { transform: translate(-50.6%, 72%) rotate(-0.6deg); }
    .caret { opacity: 0 !important; }
  }
  @media (prefers-contrast: more) {
    .field, .dots { outline: 1px solid var(--bb-60); }
    .pg-sub, .patents, .footer, .field-label, .app-brand { color: var(--black); }
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
  #check-out { display: none; }
</style>
</head>
<body>
<section class="pg" id="pg" aria-labelledby="pg-title">
  <header class="pg-head">
    <div class="pg-copy">
      <h2 class="pg-title" id="pg-title" data-t="headline"></h2>
      <p class="pg-sub" data-t="subhead"></p>
    </div>
    <div class="lang" id="lang" role="group" data-lang="en">
      <span class="lang-thumb" aria-hidden="true"></span>
      <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
      <button type="button" data-lang="es" aria-pressed="false" lang="es">ES</button>
    </div>
  </header>

<!-- Banknote images: public-domain obverses of the series 2009 $100 and series 2004 $50
       (U.S. government works, via Wikimedia Commons), embedded so the page stays a single file. -->
  <svg class="usd-sprite" aria-hidden="true" focusable="false">
    <defs>
      <!-- Duotone poster filters: five flat tone bands mapped from blackberry ink to a pale
           tint per note (teal for the $100, pink for the $50), so the photographs read as
           illustration alongside the flat scene while staying recognizable. -->
      <filter id="toon100" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
        <feGaussianBlur stdDeviation="1.2" result="soft"/>
        <feColorMatrix in="soft" type="saturate" values="0"/>
        <feComponentTransfer>
          <feFuncR type="gamma" amplitude="1" exponent="1.3" offset="0"/>
          <feFuncG type="gamma" amplitude="1" exponent="1.3" offset="0"/>
          <feFuncB type="gamma" amplitude="1" exponent="1.3" offset="0"/>
        </feComponentTransfer>
        <feComponentTransfer>
          <feFuncR type="discrete" tableValues="0 0.25 0.5 0.75 1"/>
          <feFuncG type="discrete" tableValues="0 0.25 0.5 0.75 1"/>
          <feFuncB type="discrete" tableValues="0 0.25 0.5 0.75 1"/>
        </feComponentTransfer>
        <feComponentTransfer>
          <feFuncR type="table" tableValues="0.125 0.26 0.46 0.74 0.93"/>
          <feFuncG type="table" tableValues="0.035 0.33 0.67 0.87 0.97"/>
          <feFuncB type="table" tableValues="0.204 0.46 0.69 0.85 0.94"/>
        </feComponentTransfer>
      </filter>
      <filter id="toon50" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
        <feGaussianBlur stdDeviation="1.2" result="soft"/>
        <feColorMatrix in="soft" type="saturate" values="0"/>
        <feComponentTransfer>
          <feFuncR type="gamma" amplitude="1" exponent="1.3" offset="0"/>
          <feFuncG type="gamma" amplitude="1" exponent="1.3" offset="0"/>
          <feFuncB type="gamma" amplitude="1" exponent="1.3" offset="0"/>
        </feComponentTransfer>
        <feComponentTransfer>
          <feFuncR type="discrete" tableValues="0 0.25 0.5 0.75 1"/>
          <feFuncG type="discrete" tableValues="0 0.25 0.5 0.75 1"/>
          <feFuncB type="discrete" tableValues="0 0.25 0.5 0.75 1"/>
        </feComponentTransfer>
        <feComponentTransfer>
          <feFuncR type="table" tableValues="0.125 0.42 0.74 0.91 0.97"/>
          <feFuncG type="table" tableValues="0.035 0.25 0.52 0.79 0.92"/>
          <feFuncB type="table" tableValues="0.204 0.37 0.57 0.79 0.90"/>

  const STEP_MS = [4400, 2100, 6400];   // dwell per step; the ATM step types the code, then dispenses
  const IDLE_MS = 8000;                 // resume after this much idle following an interaction
  const TOTAL = STEP_MS.length;

  /* ── DOM ─────────────────────────────────────────────────────────────── */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const pg = $('#pg'), stage = $('#stage');
  const sender = $('#sender'), recipient = $('#recipient'), atm = $('#atm');
  const vPhone = $('#v-phone'), vAmount = $('#v-amount');
  const fPhone = $('#f-phone'), fAmount = $('#f-amount');
  const codeCells = $$('#code-cells span'), keys = $$('#keypad .key');
  const notifCode = $('#notif-code');
  const captionEl = $('#caption'), dotsEl = $('#dots'), langEl = $('#lang');
  const devices = [sender, recipient, atm];

  const params = new URLSearchParams(location.search);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const noAutoplay = reduceMotion || params.has('pause');

  /* ── State ───────────────────────────────────────────────────────────── */
  let lang = params.get('lang') === 'es' ? 'es' : 'en';
  let step = Math.min(TOTAL - 1, Math.max(0, (parseInt(params.get('step'), 10) || 1) - 1));
  let sceneStart = performance.now();  // scene clock: always runs
  let elapsed = 0;                     // autoplay clock: runs only while playing
  let lastTick = performance.now();
  let focused = false, lastInteract = -Infinity;

  /* ── Copy ────────────────────────────────────────────────────────────── */
  const fmt = (s, map) => s.replace(/\{(\w+)\}/g, (_, k) => map[k]);

  function applyCopy() {
    const c = COPY[lang];
    document.documentElement.lang = lang;
    langEl.dataset.lang = lang;
    langEl.setAttribute('aria-label', c.ui.languageGroup);
    $$('button', langEl).forEach(b => {
      const l = b.dataset.lang;
      b.setAttribute('aria-pressed', String(l === lang));
      b.setAttribute('aria-label', fmt(c.ui.switchTo, { lang: c.ui.langName[l] }));
    });
    $$('[data-t]').forEach(el => {
      const k = el.dataset.t;
      el.textContent = c[k] !== undefined ? c[k] : c.ui[k] !== undefined ? c.ui[k] : c.screen[k];
    });
    dotsEl.setAttribute('aria-label', c.ui.stepsGroup);
    stage.setAttribute('aria-label', c.ui.demo);
    dots.forEach((d, i) => d.setAttribute('aria-label', fmt(c.ui.goToStep, { n: i + 1, label: c.steps[i].label })));
    notifCode.textContent = DEMO.code.slice(0, 3) + ' ' + DEMO.code.slice(3);
    renderCaption();
  }
  function renderCaption() {
    const c = COPY[lang];
    captionEl.textContent = fmt(c.ui.stepOf, { n: step + 1, total: TOTAL }) + ' ' + c.steps[step].caption;
  }

  /* ── Dots ────────────────────────────────────────────────────────────── */
  for (let i = 0; i < TOTAL; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'dot';
    b.innerHTML = '<span class="fill"></span>';
    b.addEventListener('click', () => { interact(); goTo(i); });
    dotsEl.appendChild(b);
  }
  const dots = $$('.dot', dotsEl);

  /* ── Scene rendering — pure function of (step, t) ─────────────────────
     Each step's choreography is described by time offsets; rendering is
     idempotent, so it stays correct when frames are skipped. */
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  function renderScene(t) {
    // Sender
    const nP = step === 0 ? clamp(Math.floor((t - 350) / 75), 0, DEMO.phone.length) : (step > 0 ? DEMO.phone.length : 0);
    const nA = step === 0 ? clamp(Math.floor((t - 1700) / 150), 0, DEMO.amount.length) : (step > 0 ? DEMO.amount.length : 0);
    setText(vPhone, DEMO.phone.slice(0, nP));
    setText(vAmount, DEMO.amount.slice(0, nA));
    fPhone.classList.toggle('is-focus', step === 0 && t >= 250 && nP < DEMO.phone.length);
    fAmount.classList.toggle('is-focus', step === 0 && nP >= DEMO.phone.length && t < 2700);
    sender.classList.toggle('is-pressed', step === 0 && t >= 2800 && t < 3000);
    sender.classList.toggle('is-sent', step > 0 || t >= 3000);

    // Recipient
    recipient.classList.toggle('is-notified', step > 1 || (step === 1 && t >= 450));

    // ATM: type the code, pause, then dispense
    const nC = step === 2 ? clamp(Math.floor((t - 600) / 320), 0, 6) : 0;
    codeCells.forEach((cell, i) => {
      const filled = i < nC;
      cell.classList.toggle('is-filled', filled);
      setText(cell, filled ? DEMO.code[i] : '');
    });
    let pressedKey = -1;
    if (step === 2 && nC < 6 && t >= 600 && ((t - 600) % 320) < 170) pressedKey = keyIndex(DEMO.code[nC]);
    keys.forEach((k, i) => k.classList.toggle('is-pressed', i === pressedKey));
    atm.classList.toggle('is-dispensing', step === 2 && t >= 3300);
  }
  function keyIndex(ch) { return ch === '0' ? 10 : (parseInt(ch, 10) - 1); }
  function setText(el, s) { if (el.textContent !== s) el.textContent = s; }

  /* ── Steps ───────────────────────────────────────────────────────────── */
  function goTo(n, d) {
    n = ((n % TOTAL) + TOTAL) % TOTAL;
    const dir = d !== undefined ? d : (n > step || (step === TOTAL - 1 && n === 0) ? 1 : -1);
    const from = devices[step], to = devices[n];
    step = n;
    sceneStart = performance.now();
    elapsed = 0;
    devices.forEach((dv, i) => dv.classList.toggle('is-active', i === step));
    if (from !== to) morph(from, to, dir);
    dots.forEach((dot, i) => {
      dot.style.setProperty('--p', 0);
      if (i === step) dot.setAttribute('aria-current', 'step'); else dot.removeAttribute('aria-current');
    });
    renderCaption();
    renderScene(noAutoplay ? 1e9 : 0);
  }
  /* Transitions between devices. Phone -> phone flips over like handing the
     phone across; phone <-> ATM stretches one body into the other (FLIP: the
     leaving device scales to the arriving device's box while the arriving one
     starts from the leaving box), with a cross-fade at the midpoint. */
  let running = [];
  const innerOf = (dv) => dv.classList.contains('atm') ? $$('.atm-body > *', dv) : [$('.screen', dv)];
  function morph(from, to, dir) {
    running.forEach(a => a.cancel()); running = [];
    $$('.is-leaving', stage).forEach(el => el.classList.remove('is-leaving'));
    from.classList.add('is-leaving');
    const anims = [];
    const ease = 'cubic-bezier(.2,.8,.2,1)';
    if (reduceMotion) {
      anims.push(from.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, fill: 'forwards' }));
      anims.push(to.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 180, fill: 'forwards' }));
    } else if (from.classList.contains('phone') && to.classList.contains('phone')) {
      // Hand the phone across: flip out, flip in.
      const sgn = dir > 0 ? -1 : 1;
      anims.push(from.animate(
        [{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(' + (sgn * 90) + 'deg)' }],
        { duration: 300, easing: 'cubic-bezier(.4,0,.8,.4)', fill: 'forwards' }));
      anims.push(to.animate(
        [{ transform: 'rotateY(' + (-sgn * 90) + 'deg)' }, { transform: 'rotateY(0deg)' }],
        { duration: 380, delay: 290, easing: ease, fill: 'both' }));
    } else {
      // Phone <-> ATM: the body stretches into the other body (FLIP). Contents
      // drop out first and arrive last, so the midpoint is one solid slab.
      const fr = from.getBoundingClientRect(), tr = to.getBoundingClientRect();
      const sx = tr.width / fr.width, sy = tr.height / fr.height;
      const dx = (tr.left + tr.width / 2) - (fr.left + fr.width / 2);
      const dy = (tr.top + tr.height / 2) - (fr.top + fr.height / 2);
      const D = 780;
      const stretch = 'cubic-bezier(.35,.55,.2,1)';
      anims.push(from.animate(
        [{ transform: 'translate(0,0) scale(1,1)', opacity: 1, offset: 0 },
         { opacity: 1, offset: 0.5 },
         { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')', opacity: 0, offset: 1 }],
        { duration: D, easing: stretch, fill: 'forwards' }));
      anims.push(to.animate(
        [{ transform: 'translate(' + (-dx) + 'px,' + (-dy) + 'px) scale(' + (1 / sx) + ',' + (1 / sy) + ')', opacity: 0, offset: 0 },
         { opacity: 0, offset: 0.25 },
         { opacity: 1, offset: 0.6 },
         { transform: 'translate(0,0) scale(1,1)', opacity: 1, offset: 1 }],
        { duration: D, easing: stretch, fill: 'both' }));
      innerOf(from).forEach(el => anims.push(el.animate(
        [{ opacity: 1 }, { opacity: 0 }], { duration: D * 0.26, easing: 'ease-out', fill: 'forwards' })));
      innerOf(to).forEach(el => anims.push(el.animate(
        [{ opacity: 0, offset: 0 }, { opacity: 0, offset: 0.72 }, { opacity: 1, offset: 1 }],
        { duration: D, easing: stretch, fill: 'both' })));
    }
    running = anims;
    const done = () => {
      if (running !== anims) return;         // superseded by a newer morph
      running = [];
      anims.forEach(a => { try { a.cancel(); } catch (_) {} });   // drop fills; classes hold the end state
      from.classList.remove('is-leaving');
    };
    Promise.all(anims.map(a => a.finished)).then(done, () => {});
  }

  const next = () => goTo(step + 1, 1);
  const prev = () => goTo(step - 1, -1);

  /* ── Autoplay ────────────────────────────────────────────────────────── */
  function isPaused(now) {
    return noAutoplay || document.hidden || focused || (now - lastInteract) < IDLE_MS;
  }
  function interact() { lastInteract = performance.now(); }

  function tick(now) {
    const dt = Math.min(100, now - lastTick);
    lastTick = now;
    const paused = isPaused(now);
    if (!paused) elapsed += dt;
    renderScene(now - sceneStart);
    const active = dots[step];
    active.classList.toggle('no-progress', noAutoplay);
    active.style.setProperty('--p', clamp(elapsed / STEP_MS[step], 0, 1).toFixed(4));
    if (!paused && elapsed >= STEP_MS[step]) next();
    requestAnimationFrame(tick);
  }

  /* ── Quiet controls: dots, arrow keys, swipe. Focus pauses. ─────────── */
  pg.addEventListener('focusin', () => { focused = true; });
  pg.addEventListener('focusout', (e) => { if (!pg.contains(e.relatedTarget)) { focused = false; interact(); } });
  document.addEventListener('visibilitychange', () => { lastTick = performance.now(); });

  $$('button', langEl).forEach(b => b.addEventListener('click', () => {
    interact();
    if (b.dataset.lang !== lang) { lang = b.dataset.lang; applyCopy(); }
  }));

  document.addEventListener('keydown', (e) => {
    const tgt = e.target;
    if (tgt && (tgt.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(tgt.tagName))) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); interact(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); interact(); prev(); }
  });

  (() => {   // swipe: 1:1 tracking with rubber-banding, decide on velocity
    let id = null, x0 = 0, y0 = 0, dragging = false, hist = [];
    const W = () => stage.getBoundingClientRect().width || 1;
    const rubber = (d, dim, c = 0.55) => (d * dim * c) / (dim + c * Math.abs(d));
    stage.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      id = e.pointerId; x0 = e.clientX; y0 = e.clientY; dragging = false;
      hist = [{ x: e.clientX, t: e.timeStamp }];
    });
    stage.addEventListener('pointermove', (e) => {
      if (e.pointerId !== id) return;
      const dx = e.clientX - x0, dy = e.clientY - y0;
      hist.push({ x: e.clientX, t: e.timeStamp }); if (hist.length > 6) hist.shift();
      if (!dragging) {
        if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy)) return;
        dragging = true;
        try { stage.setPointerCapture(id); } catch (_) {}
        stage.classList.add('is-dragging');
        interact();
      }
      if (!reduceMotion) stage.style.transform = 'translateX(' + rubber(dx, W() * 0.35).toFixed(1) + 'px)';
    });
    const end = (e) => {
      if (e.pointerId !== id) return;
      id = null;
      if (!dragging) return;
      dragging = false;
      stage.classList.remove('is-dragging');
      stage.style.transform = '';
      const a = hist[0], b = hist[hist.length - 1];
      const v = b.t > a.t ? (b.x - a.x) / ((b.t - a.t) / 1000) : 0;
      const dx = e.clientX - x0;
      if (Math.abs(v) > 350) { v < 0 ? next() : prev(); }
      else if (Math.abs(dx) > 48) { dx < 0 ? next() : prev(); }
      interact();
    };
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointercancel', end);
  })();

  /* ── Boot ────────────────────────────────────────────────────────────── */
  applyCopy();
  goTo(step, 1);
  if (!noAutoplay) requestAnimationFrame(tick);
  else { renderScene(1e9); dots[step].classList.add('no-progress'); }
  // ?morph=<ms> (with ?pause=1): freeze the transition to the next step at that time, for review.
  if (params.has('morph')) {
    next();
    document.getAnimations().forEach(an => { an.pause(); an.currentTime = +params.get('morph') || 0; });
  }

  /* ── Self-check (only with ?check=1): overflow + clipping report ─────── */
  if (params.has('check')) {
    const out = [];
    const report = (m) => { out.push(m); console.log('CHECK ' + m); };
    const desc = (el) => el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + (typeof el.className === 'string' && el.className ? '.' + el.className.trim().split(/\s+/).join('.') : '');
    const run = () => {
      ['en', 'es'].forEach(l => {
        lang = l; applyCopy();
        for (let s = 0; s < TOTAL; s++) {
          goTo(s, 1); renderScene(1e9);
          const de = document.documentElement;
          if (de.scrollWidth > window.innerWidth + 1) report(`FAIL ${l} step${s + 1}: page scrollWidth ${de.scrollWidth} > ${window.innerWidth}`);
          $$('*', pg).forEach(el => {
            if (el.closest('.sr-only') || el.id === 'check-out') return;
            const cs = getComputedStyle(el);
            if (cs.visibility === 'hidden' || cs.display === 'none' || parseFloat(cs.opacity) === 0) return;
            const r = el.getBoundingClientRect();
            if (r.width === 0 && r.height === 0) return;
            if (r.right > window.innerWidth + 1 || r.left < -1) report(`FAIL ${l} step${s + 1}: ${desc(el)} exceeds viewport (${r.left.toFixed(0)}..${r.right.toFixed(0)})`);
            if (/(hidden|clip)/.test(cs.overflow) && !el.hasAttribute('data-clip-ok') && !el.classList.contains('dot')) {
              if (el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) report(`FAIL ${l} step${s + 1}: ${desc(el)} content clipped (${el.scrollWidth}x${el.scrollHeight} in ${el.clientWidth}x${el.clientHeight})`);
            }
            if (cs.whiteSpace === 'nowrap' && el.scrollWidth > el.clientWidth + 1) report(`FAIL ${l} step${s + 1}: ${desc(el)} nowrap text overflows`);
          });
        }
      });
      if (!out.length) report('OK no overflow or clipping at ' + window.innerWidth + 'px');
      $('#check-out').textContent = out.join('\n');
      $('#check-out').style.display = 'block';
      document.title = 'CHECK ' + (out.some(l => l.startsWith('FAIL')) ? 'FAIL' : 'OK') + ' ' + window.innerWidth;
    };
    setTimeout(run, 50);
  }
})();
</script>
</body>
</html>
